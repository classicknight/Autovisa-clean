  </select>
</div>

  <div class="geo-input">
    <input
      type="text"
      id="ort"
      name="ort"
      placeholder="z. B. 10115 oder Berlin"
      autocomplete="off"
    />
    <button type="button" class="geo-btn" id="geoBtnCriteria" aria-label="Standort verwenden" title="Standort verwenden">
      <i class="fa-solid fa-location-crosshairs" aria-hidden="true"></i>

  </div>

  <input type="hidden" id="ort-lon" name="ort_lon">
</div>

<div class="search-group" id="group-umkreis">

    <option value="">Beliebig</option>
    <option value="custom">Benutzerdefiniert</option>
    <option value="10">10 km</option>
    <option value="25">25 km</option>
    <option value="50">50 km</option>
    <option value="100">100 km</option>
    <option value="200">200 km</option>

</div>

<script>
  const fadeElems = document.querySelectorAll('[data-fade]');
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
      }
    });
  }, { threshold: 0.1 });
  
  fadeElems.forEach(el => observer.observe(el));
</script>
