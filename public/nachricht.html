<!DOCTYPE html>
<html lang="de" class="no-js">
<head>
  <meta charset="UTF-8" />

  <link rel="stylesheet" href="nachricht.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" />


    <!-- Font: Inter -->

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
    <!-- Icons (optional) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  

  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkfYV9Z8HfC1Fe1ZC1vZ1tcHTul3e8Dqg3Oq2v5E3WfWUE+Kf4Z5qXQ2A=="
  crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Slim Select v2.6.0 – für korrektes Custom-Styling -->
  <link href="https://cdn.jsdelivr.net/npm/slim-select@2.6.0/dist/slimselect.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/slim-select@2.6.0/dist/slimselect.min.js"></script>
  <script src="analytics.js" defer></script>
  <link rel="icon" href="/favicon.ico?v=3">
  <link rel="shortcut icon" href="/favicon.ico?v=3">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
</head>
<body>
<!-- Navbar -->
<nav class="navbar">
  <!-- Logo (klickbar -> Startseite) -->
  <a href="index.html" class="logo-container" aria-label="Autovisa Startseite">
    <img src="autovisa-logo.png" alt="Autovisa Logo" class="logo" />

    <span class="logo-divider" aria-hidden="true"></span>

    <span class="logo-tagline">
      <span class="tagline-line1">Autos kaufen</span>
      <span class="tagline-line2">&amp; verkaufen</span>
    </span>
  </a>

  <!-- Rechte Seite: Icons (mobile) + Hamburger + Links -->
  <div class="navbar-right-mobile">
    <!-- Mobile Icons -->
    <div class="mobile-shortcuts">
   

      <a href="übersicht.html#saved-cars" id="mobile-saved" aria-label="Gespeicherte Autos" title="Gespeicherte Autos">
        <i class="fas fa-heart" aria-hidden="true"></i>
      </a>

      <a href="übersicht.html#messages-list" id="mobile-messages" aria-label="Nachrichten" title="Nachrichten">
        <i class="fas fa-comments" aria-hidden="true"></i>
      </a>
    </div>

    <button
      class="hamburger"
      id="hamburger"
      aria-label="Menü öffnen"
      aria-expanded="false"
      aria-controls="nav-links"
      type="button"
    >
      <i class="fas fa-bars" aria-hidden="true"></i>
    </button>

    <!-- Navigationslinks -->
    <ul class="nav-links" id="nav-links">
      <!-- Suchen -->
      <li>
        <a href="index.html#search-section" class="nav-link">
          <i class="fas fa-search" aria-hidden="true"></i>
          <span>Suchen</span>
        </a>
      </li>

      <!-- Desktop Icons -->
   <!-- NEU: Übersicht (Icon + Text im Burger, nur Icon auf Desktop) -->
<li class="nav-icon-only">
  <a href="übersicht.html" id="overview-link" class="nav-link" title="Übersicht">
    <i class="fa-solid fa-house" aria-hidden="true"></i>
    <span>Übersicht</span>
  </a>
</li>

<li class="nav-icon-only">
  <a href="übersicht.html#saved-cars" id="saved-cars-link" class="nav-link" title="Gespeicherte Autos">
    <i class="fas fa-heart" aria-hidden="true"></i>
    <span>Gespeicherte Autos</span>
  </a>
</li>

<li class="nav-icon-only">
  <a href="übersicht.html#messages-list" id="messages-link" class="nav-link" title="Nachrichten">
    <i class="fas fa-comments" aria-hidden="true"></i>
    <span>Nachrichten</span>
  </a>
</li>


      <!-- Account (Login/Logout wird von deinem JS ersetzt) -->
      <li id="auth-link">
        <a href="login.html" class="nav-link">
          <i class="fas fa-user" aria-hidden="true"></i>
          <span>Login</span>
        </a>
      </li>

      <!-- Call to Action -->
      <li class="active">
        <a href="verkaufen.html" class="highlight-link">
          <i class="fas fa-plus-circle" aria-hidden="true"></i>
          <span>Auto verkaufen</span>
        </a>
      </li>
    </ul>
  </div>
</nav>


  


<section class="chat-container" id="chat-container" aria-live="polite">
  <!-- Header mit Fahrzeug -->
  <div class="chat-header" id="chat-header">
    <img id="car-img" src="" alt="Fahrzeug" />
    <div class="chat-header-info">
      <h2 id="car-title">Fahrzeug</h2>
      <p id="car-price"></p>
    </div>
  </div>

  <!-- Nachrichtenliste -->
  <div class="chat-messages" id="chat-messages" role="log" aria-label="Chatverlauf"></div>

  <!-- Eingabe -->
  <form class="chat-input-area" id="chat-form" autocomplete="off">
    <input type="text" id="chat-input" placeholder="Nachricht schreiben..." required />
    <button type="submit" aria-label="Senden"><i class="fas fa-paper-plane"></i></button>
  </form>
</section>



<!-- Behalte deinen Dateinamen – hier verwende ich 'nachrichten.js' -->
<script src="nachricht.js"></script>
  <script src="ui-feedback.js" defer></script>
</body>
</html>
