<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Autovisa – Instagram Post Template</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Schrift -->
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="insta-template.css" />
</head>
<body>
  <div class="page">
    <!-- Linke Seite: Eingaben -->
    <div class="config-panel">
      <h1>Instagram Post Generator</h1>

      <div class="field-group">
        <label for="imageInput">Fahrzeugbild hochladen</label>
        <input type="file" id="imageInput" accept="image/*" />
      </div>

      <div class="field-group">
        <label for="modelInput">Modell</label>
        <input type="text" id="modelInput" placeholder="Audi Q5 2.0 TDI" />
      </div>

      <div class="field-row">
        <div class="field-group">
          <label for="priceInput">Preis (€)</label>
          <input type="text" id="priceInput" placeholder="28.990" />
        </div>
        <div class="field-group">
          <label for="yearInput">Baujahr</label>
          <input type="text" id="yearInput" placeholder="2016" />
        </div>
      </div>

      <div class="field-row">
        <div class="field-group">
          <label for="powerInput">Leistung (PS)</label>
          <input type="text" id="powerInput" placeholder="190" />
        </div>
        <div class="field-group">
          <label for="kmInput">Kilometerstand</label>
          <input type="text" id="kmInput" placeholder="120.000" />
        </div>
      </div>

      <p class="hint">
        Klicke rechts auf „Bild herunterladen“, um den fertigen Post als PNG zu speichern.
      </p>
    </div>

    <!-- Rechte Seite: Vorschau / fertiger Post -->
    <div class="preview-wrapper">
      <div class="preview-inner">
        <div class="post-frame">
          <!-- Beispielbild – durch dein eigenes 1.jpeg ersetzen -->
          <img src="1.jpeg" id="carImage" alt="Fahrzeugbild" />
<!-- Autovisa Logo (Overlay) -->
<div class="brand-badge" aria-label="Autovisa">
    <img src="autovisa-logo.png" alt="Autovisa Logo" class="brand-logo" />
  </div>
  
          <div class="info-bar">
            <span class="info-price" id="infoPrice">
              28.990 €
            </span>
            <span class="info-main" id="infoMain">
              Audi Q5 2.0 TDI
            </span>
            <div class="info-specs" id="infoSpecs">
                <div class="spec">
                  <span class="spec-ico" aria-hidden="true">
                    <!-- Leistung (PS) – Tacho -->
                    <svg viewBox="0 0 24 24" fill="none">
                      <path d="M6.5 17a7.5 7.5 0 1 1 11 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                      <path d="M12 12l4.2-2.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                      <path d="M7.5 17h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                  </span>
                  <span class="spec-val" id="infoPower">190</span>
                  <span class="spec-unit">PS</span>
                </div>
              
                <div class="spec">
                  <span class="spec-ico" aria-hidden="true">
                    <!-- Erstzulassung/Baujahr – Kalender -->
                    <svg viewBox="0 0 24 24" fill="none">
                      <path d="M7 3v3M17 3v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                      <path d="M4.5 8.5h15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                      <path d="M6 6h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="2"/>
                    </svg>
                  </span>
                  <span class="spec-val" id="infoYear">2016</span>
                </div>
              
                <div class="spec">
                  <span class="spec-ico" aria-hidden="true">
                    <!-- Kilometer – Straße/Pin -->
                    <svg viewBox="0 0 24 24" fill="none">
                      <path d="M12 21s6-4.4 6-10a6 6 0 1 0-12 0c0 5.6 6 10 6 10Z" stroke="currentColor" stroke-width="2"/>
                      <path d="M12 11.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z" stroke="currentColor" stroke-width="2"/>
                    </svg>
                  </span>
                  <span class="spec-val" id="infoKm">120.000</span>
                  <span class="spec-unit">km</span>
                </div>
              </div>
              
          </div>
        </div>

        <div class="preview-controls">
          <button id="downloadBtn">Bild herunterladen</button>
        </div>
      </div>
    </div>
  </div>

  <!-- html2canvas für Screenshot/Download -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="insta-template.js"></script>
  <script src="ui-feedback.js" defer></script>
</body>
</html>
