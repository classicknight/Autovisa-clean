<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autovisa – Login & Registrierung</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="login.css" />
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-box">
      <img src="AUTOVISA LOGO.PNG" alt="Autovisa Logo" class="auth-logo" />

<div class="tab-buttons">
  <button id="loginTab" class="active" onclick="showTab('login')">
    <i class="fa-solid fa-right-to-bracket"></i> Login
  </button>
  <button id="registerTab" onclick="showTab('register')">
    <i class="fa-solid fa-user-plus"></i> Registrieren
  </button>
</div>

<div class="tab-content" id="login">
  <form onsubmit="return false">
    <label for="loginEmail">E-Mail</label>
    <input type="email" id="loginEmail" placeholder="name@domain.de" required />
    
    <label for="loginPassword">Passwort</label>
    <div class="password-wrapper">
      <input type="password" id="loginPassword" placeholder="●●●●●●●●" required />
      <i class="fa-solid fa-eye toggle-password" data-target="loginPassword"></i>
    </div>
    
    <div class="forgot-link"><a href="#">Passwort vergessen?</a></div>
    
    <button type="submit" class="submit-btn">Einloggen</button>
  </form>
</div>

<div class="tab-content hidden" id="register">
  <form onsubmit="return false">
    <div class="alt-registration">
      <p>Sie sind Händler?</p>
      <a href="händlerweb.html" class="dealer-btn">Jetzt als Händler registrieren</a>
    </div>
    
    <label for="registerName">Name</label>
    <input type="text" id="registerName" placeholder="Max Mustermann" required />
    
    <label for="registerEmail">E-Mail</label>
    <input type="email" id="registerEmail" placeholder="name@domain.de" required />
    
    <label for="registerPassword">Passwort</label>
    <div class="password-wrapper">
      <input type="password" id="registerPassword" required minlength="8" />
      <i class="fa-solid fa-eye toggle-password" data-target="registerPassword"></i>
    </div>
    <small class="password-hint">
      Mindestens 8 Zeichen, empfohlen 12+ inkl. Groß-/Kleinbuchstaben, Zahl & Sonderzeichen
    </small>
    
    <label for="registerPasswordRepeat">Passwort wiederholen</label>
    <div class="password-wrapper">
      <input type="password" id="registerPasswordRepeat" required minlength="8" />
      <i class="fa-solid fa-eye toggle-password" data-target="registerPasswordRepeat"></i>
    </div>
    
    <label class="checkbox-label">
      <input type="checkbox" required />
      Ich akzeptiere die <a href="#">AGB</a> & <a href="#">Datenschutz</a>
    </label>
    
    <button type="submit" class="submit-btn">Registrieren</button>
  </form>
</div>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
