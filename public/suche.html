   <!-- NEU: Übersicht (Icon + Text im Burger, nur Icon auf Desktop) -->

<!-- Filterbutton für Mobilgeräte -->
<button class="toggle-filters" id="toggleFiltersBtn">
  <i class="fas fa-sliders-h"></i> Filter anzeigen
</button>

<div class="search-layout">
  <aside class="filter-sidebar" id="filterSidebar">
    <h2>Filter</h2>

    <!-- Preis -->
    <div class="filter-group">
      <label for="priceFrom">Preis (€)</label>
      <div class="range-inputs">
        <input type="number" id="priceFrom" placeholder="von" min="0" />
        <input type="number" id="priceTo" placeholder="bis" min="0" />
      </div>
    </div>

    <!-- Erstzulassung -->
    <div class="filter-group">
      <label>Erstzulassung</label>
      <div class="range-inputs month-range" id="firstRegRange">
        <div class="range-item">
          <span class="range-sub">von</span>
          <input type="month" id="firstRegFrom" aria-label="Erstzulassung von" />
          <div class="month-fallback">
            <select id="first-registration-month" aria-label="Erstzulassung von Monat">
              <option value="">Monat</option>
              <option value="01">Januar</option>
              <option value="02">Februar</option>
              <option value="03">März</option>
              <option value="04">April</option>
              <option value="05">Mai</option>
              <option value="06">Juni</option>
              <option value="07">Juli</option>
              <option value="08">August</option>
              <option value="09">September</option>
              <option value="10">Oktober</option>
              <option value="11">November</option>
              <option value="12">Dezember</option>
            </select>
            <select id="first-registration-year" aria-label="Erstzulassung von Jahr">
              <option value="">Jahr</option>
              <!-- wird per JS befüllt -->
            </select>
          </div>
        </div>
        <div class="range-item">
          <span class="range-sub">bis</span>
          <input type="month" id="firstRegTo" aria-label="Erstzulassung bis" />
          <div class="month-fallback">
            <select id="first-registration-month-to" aria-label="Erstzulassung bis Monat">
              <option value="">Monat</option>
              <option value="01">Januar</option>
              <option value="02">Februar</option>
              <option value="03">März</option>
              <option value="04">April</option>
              <option value="05">Mai</option>
              <option value="06">Juni</option>
              <option value="07">Juli</option>
              <option value="08">August</option>
              <option value="09">September</option>
              <option value="10">Oktober</option>
              <option value="11">November</option>
              <option value="12">Dezember</option>
            </select>
            <select id="first-registration-year-to" aria-label="Erstzulassung bis Jahr">
              <option value="">Jahr</option>
              <!-- wird per JS befüllt -->
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- Kilometer -->
    <div class="filter-group">
      <label for="mileageFrom">Kilometerstand</label>
      <div class="range-inputs">
        <input type="number" id="mileageFrom" placeholder="von" min="0" />
        <input type="number" id="mileageTo" placeholder="bis" min="0" />
      </div>
    </div>

    <!-- Leistung -->
    <div class="filter-group">
      <label for="powerFrom">Leistung (PS)</label>
      <div class="range-inputs">
        <input type="number" id="powerFrom" placeholder="von" min="0" />
        <input type="number" id="powerTo" placeholder="bis" min="0" />
      </div>
    </div>

    <!-- Kraftstoff -->
    <div class="filter-group">
      <p class="avf-title">Kraftstoff</p>
      <div class="avf-grid" id="fuelGrid">
        <label class="avf-check-tile">
          <input type="checkbox" name="kraftstoff" value="benzin">
          <span class="avf-label">Benzin</span>
        </label>
        <label class="avf-check-tile">
          <input type="checkbox" name="kraftstoff" value="diesel">
          <span class="avf-label">Diesel</span>
        </label>
        <label class="avf-check-tile">
          <input type="checkbox" name="kraftstoff" value="elektrisch">
          <span class="avf-label">Elektro</span>
        </label>
        <label class="avf-check-tile">
          <input type="checkbox" name="kraftstoff" value="hybrid-benzin">
          <span class="avf-label">Hybrid (Benzin)</span>
        </label>
        <label class="avf-check-tile">
          <input type="checkbox" name="kraftstoff" value="hybrid-diesel">
          <span class="avf-label">Hybrid (Diesel)</span>
        </label>
        <label class="avf-check-tile">
          <input type="checkbox" name="kraftstoff" value="lpg">
          <span class="avf-label">Autogas (LPG)</span>
        </label>
        <label class="avf-check-tile">
          <input type="checkbox" name="kraftstoff" value="ethanol">
          <span class="avf-label">Ethanol</span>
        </label>
        <label class="avf-check-tile">
          <input type="checkbox" name="kraftstoff" value="wasserstoff">
          <span class="avf-label">Wasserstoff</span>
        </label>
      </div>
    </div>

    <!-- Getriebe -->
    <div class="filter-group">
      <label for="transmission">Getriebe</label>
      <select id="transmission" class="avf-select">
        <option>Beliebig</option>
        <option>Manuell</option>
        <option>Automatik</option>
      </select>
    </div>

    <!-- Fahrzeugtyp -->
    <div class="filter-group">
      <p class="avf-title">Fahrzeugtyp</p>
      <div class="avf-grid" id="vehicletype-grid">
        <label class="avf-check-tile"><input type="checkbox" name="fahrzeugtyp" value="Limousine"><span class="avf-label">Limousine</span></label>
        <label class="avf-check-tile"><input type="checkbox" name="fahrzeugtyp" value="Kombi"><span class="avf-label">Kombi</span></label>
        <label class="avf-check-tile"><input type="checkbox" name="fahrzeugtyp" value="Geländewagen / SUV"><span class="avf-label">Geländewagen / SUV</span></label>
        <label class="avf-check-tile"><input type="checkbox" name="fahrzeugtyp" value="Cabrio / Roadster"><span class="avf-label">Cabrio / Roadster</span></label>
        <label class="avf-check-tile"><input type="checkbox" name="fahrzeugtyp" value="Sportwagen / Coupé"><span class="avf-label">Sportwagen / Coupé</span></label>
        <label class="avf-check-tile"><input type="checkbox" name="fahrzeugtyp" value="Kleinwagen"><span class="avf-label">Kleinwagen</span></label>
        <label class="avf-check-tile"><input type="checkbox" name="fahrzeugtyp" value="Van / Minibus"><span class="avf-label">Van / Minibus</span></label>
      </div>
    </div>

    <!-- Farbe -->
    <div class="filter-group">
      <p class="avf-title">Farbe</p>
      <div class="avf-color-grid" id="color-grid">
        <label class="avf-color-tile">
          <input type="checkbox" name="farbe" value="Schwarz">
          <span class="avf-swatch" style="--c:#111"></span><span class="avf-label">Schwarz</span>
        </label>
        <label class="avf-color-tile">
          <input type="checkbox" name="farbe" value="Weiß">
          <span class="avf-swatch" style="--c:#fff; --b:#e4e7eb"></span><span class="avf-label">Weiß</span>
        </label>
        <label class="avf-color-tile">
          <input type="checkbox" name="farbe" value="Silber">
          <span class="avf-swatch" style="--c:#c9cdd3"></span><span class="avf-label">Silber</span>
        </label>
        <label class="avf-color-tile">
          <input type="checkbox" name="farbe" value="Grau">
          <span class="avf-swatch" style="--c:#7a828e"></span><span class="avf-label">Grau</span>
        </label>
        <label class="avf-color-tile">
          <input type="checkbox" name="farbe" value="Blau">
          <span class="avf-swatch" style="--c:#2f6fb5"></span><span class="avf-label">Blau</span>
        </label>
        <label class="avf-color-tile">
          <input type="checkbox" name="farbe" value="Rot">
          <span class="avf-swatch" style="--c:#c63535"></span><span class="avf-label">Rot</span>
        </label>
        <label class="avf-color-tile">
          <input type="checkbox" name="farbe" value="Grün">
          <span class="avf-swatch" style="--c:#2a8b57"></span><span class="avf-label">Grün</span>
        </label>
        <label class="avf-color-tile">
          <input type="checkbox" name="farbe" value="Gelb">
          <span class="avf-swatch" style="--c:#ffcc33"></span><span class="avf-label">Gelb</span>
        </label>
      </div>
    </div>

 <!-- Unfallfrei / HU -->
<div class="filter-group">
  <label class="avf-switch">
    <input type="checkbox" id="unfallfrei" name="unfallfrei" value="1" />
    <span>Nur unfallfreie Fahrzeuge</span>
  </label>
</div>


    <div class="filter-button-wrapper">
      <button class="more-filters-button" id="moreFiltersBtn">Weitere Filter</button>
      <button class="filter-button" id="applyFiltersBtn">Anwenden</button>
    </div>
  </aside>


    <div class="results-container">
      <div class="sort-wrapper">
        <div class="sort-bar">
          <label for="sortBy"><i class="fas fa-sort-amount-down-alt"></i> Sortieren nach:</label>
          <select id="sortBy">
            <option value="relevance">Relevanz</option>
            <option value="price-asc">Preis aufsteigend</option>
            <option value="price-desc">Preis absteigend</option>
            <option value="date-desc">Neueste zuerst</option>
            <option value="mileage-asc">Kilometer aufsteigend</option>
          </select>
        </div>
      </div>
     
      <!-- Aktive Filter -->
<div class="active-filter-bar" id="activeFilterBar" aria-live="polite"></div>

      <section class="results-section">
        <div class="car-results" id="carResults">
          <!-- Fahrzeugkarten per JS -->
        </div>
        <div class="pager" id="pager"></div>
        <p class="vat-footnote" id="vatFootnoteSearch" hidden>¹ MwSt.-Hinweis: Preisangabe enthält MwSt.-Info (Details im Inserat).</p>
      </section>
    </div>
  </div>


<script src="suche.js?v=2025-10-30-2359" defer></script>

  <script src="search-form.js" defer></script>

  <script src="ui-feedback.js" defer></script>
</body>
</html>
