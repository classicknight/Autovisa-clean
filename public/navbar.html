<!DOCTYPE html>
<html lang="de" class="no-js">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autovisa – Navbar</title>

  <link rel="stylesheet" href="navbar.css" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  <script src="analytics.js" defer></script>
  <link rel="icon" href="/favicon.ico?v=3">
  <link rel="shortcut icon" href="/favicon.ico?v=3">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar" role="navigation" aria-label="Hauptnavigation">
    <!-- Logo (klickbar -> Startseite) -->
    <a href="index.html" class="logo-container" aria-label="Autovisa Startseite">
      <img src="autovisa-logo.png" alt="Autovisa Logo" class="logo" />
      <span class="logo-divider" aria-hidden="true"></span>
      <span class="logo-tagline" aria-hidden="true">
        <span class="tagline-line1">Autos kaufen</span>
        <span class="tagline-line2">&amp; verkaufen</span>
      </span>
    </a>

    <!-- Rechte Seite -->
    <div class="navbar-right-mobile">
      <!-- Mobile Icons -->
      <div class="mobile-shortcuts" aria-label="Schnellzugriff">
        <a href="übersicht.html#saved-cars" id="mobile-saved" class="icon-btn" aria-label="Gespeicherte Autos" title="Gespeicherte Autos">
          <i class="fa-solid fa-heart" aria-hidden="true"></i>
        </a>
        <a href="übersicht.html#messages-list" id="mobile-messages" class="icon-btn" aria-label="Nachrichten" title="Nachrichten">
          <i class="fa-solid fa-comments" aria-hidden="true"></i>
        </a>
        <a href="übersicht.html" id="mobile-overview" class="icon-btn" aria-label="Übersicht" title="Übersicht">
          <i class="fa-solid fa-table-cells" aria-hidden="true"></i>
        </a>
      </div>

      <button
        class="hamburger"
        id="hamburger"
        aria-label="Menü öffnen"
        aria-expanded="false"
        aria-controls="nav-links"
        type="button"
      >
        <span class="hamburger-lines" aria-hidden="true"></span>
      </button>

      <!-- Links -->
      <ul class="nav-links" id="nav-links">
        <li>
          <a href="index.html#search-section" class="nav-link">
            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
            <span>Suchen</span>
          </a>
        </li>

        <!-- Übersicht nur als Icon -->
        <li class="nav-icon-only desktop-only">
          <a href="übersicht.html" id="overview-link" class="icon-btn" aria-label="Übersicht" title="Übersicht">
            <i class="fa-solid fa-table-cells" aria-hidden="true"></i>
          </a>
        </li>

        <!-- Desktop Icons -->
        <li class="nav-icon-only desktop-only">
          <a href="übersicht.html#saved-cars" id="saved-cars-link" class="icon-btn" aria-label="Gespeicherte Autos" title="Gespeicherte Autos">
            <i class="fa-solid fa-heart" aria-hidden="true"></i>
          </a>
        </li>

        <li class="nav-icon-only desktop-only">
          <a href="übersicht.html#messages-list" id="messages-link" class="icon-btn" aria-label="Nachrichten" title="Nachrichten">
            <i class="fa-solid fa-comments" aria-hidden="true"></i>
          </a>
        </li>

        <!-- Account (Login/Logout wird per JS gerendert) -->
        <li id="auth-link">
          <a href="login.html" class="nav-link">
            <i class="fa-solid fa-user" aria-hidden="true"></i>
            <span>Login</span>
          </a>
        </li>

        <!-- CTA -->
        <li class="cta">
          <a href="verkaufen.html" class="highlight-link">
            <i class="fa-solid fa-plus" aria-hidden="true"></i>
            <span>Auto verkaufen</span>
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <main style="padding: 28px; color: #e9f1f5; font-family: Inter, system-ui;">
    <h1 style="margin:0 0 10px;">Navbar Testseite</h1>
    <p style="margin:0; opacity:.75;">Hier kannst du die Navbar standalone testen.</p>
  </main>

  <script src="navbar.js"></script>
  <script src="ui-feedback.js" defer></script>
</body>
</html>
