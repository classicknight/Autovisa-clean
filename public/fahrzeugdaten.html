


<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto verkaufen – Autovisa</title>

  <link rel="stylesheet" href="fahrzeugdaten.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" />
  <script src="analytics.js" defer></script>
  <link rel="icon" href="/favicon.ico?v=2">
  <link rel="shortcut icon" href="/favicon.ico?v=2">
  <link rel="apple-touch-icon" href="/favicon.ico?v=2">
</head>
<body>

      <nav class="navbar">
  <!-- Logo + Tagline (wie auf Startseite), aber ohne Link wenn du willst -->
  <div class="logo-container" aria-label="Autovisa">
    <img src="autovisa-logo.png" alt="Autovisa Logo" class="logo" />
    
    <span class="logo-divider" aria-hidden="true"></span>
    
    <span class="logo-tagline">
      <span class="tagline-line1">Autos kaufen</span>
      <span class="tagline-line2">&amp; verkaufen</span>
    </span>
  </div>
  
  <!-- Progress bleibt gleich -->
  <div class="progress-wrapper">
    <i class="fas fa-car-side progress-icon start-icon"></i>
    
    <div class="progress-track">
      <div class="progress-fill" id="progress-bar" style="width: 0%;">
        <div class="progress-thumb" id="progress-thumb" aria-hidden="true"></div>
      </div>
    </div>
    
    <i class="fas fa-flag-checkered progress-icon end-icon"></i>
  </div>
</nav>

<!-- =========================
     Fahrzeugdaten – komplett sauber korrigiert
     (keine doppelten </form>/<main>, alle Rows korrekt geschlossen)
========================= -->














<main class="form-section">
  <div class="form-container">
    <h1 class="form-heading">Fahrzeugdaten eingeben</h1>

    <form id="fahrzeugForm">
      <!-- Marke / Modell / Variante / Motor -->
      <div class="form-row">
        <div class="form-group">
          <label for="marke">Marke</label>
          <select id="marke" name="marke" required>
            <option value="" disabled selected>Bitte wählen</option>
                <option value="BMW">BMW</option>
    <option value="Haval">Haval</option>
            <option value="BYD">BYD</option>
            <option value="Haval">Haval</option>
            <!-- ... -->
          </select>
        </div>

        <div class="form-group">
          <label for="modell">Modell</label>
          <select id="modell" name="modell" required>
            <option value="" disabled selected>Bitte zuerst Marke wählen</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="variante">Variante</label>
          <select id="variante" name="variante" required>
            <option value="" disabled selected>Bitte zuerst Modell wählen</option>
          </select>
        </div>

        <div class="form-group">
          <label for="motor">Motor</label>
          <select id="motor" name="motor" required>
            <option value="" disabled selected>Bitte zuerst Variante wählen</option>
          </select>
        </div>
      </div>

      <!-- Titel -->
      <div class="form-row">
        <div class="form-group col-12">
          <label for="titel">Titel der Anzeige</label>
          <input
            type="text"
            id="titel"
            name="titel"
            placeholder="z. B. Audi A4 Avant 2.0 TDI S line"
            required>
        </div>
      </div>

      <!-- Preis & MwSt -->
      <div class="form-row form-row--price" id="preis-wrapper">
        <div class="form-group">
          <label for="preis">Preis (€)</label>
          <input type="number" id="preis" name="preis" placeholder="z. B. 18900" min="0">
        </div>

        <label class="av-check mwst-toggle" for="mwst-ausweisbar" title="MwSt. ausweisbar">
          <input type="checkbox" id="mwst-ausweisbar" name="mwst-ausweisbar">
          <span class="box">
            <svg class="tick" viewBox="0 0 24 24"><path d="M20 6l-11 11-5-5"/></svg>
          </span>
          <span class="text">MwSt. ausweisbar</span>
        </label>
      </div>

      <!-- Brutto & Netto (bei MwSt. sichtbar) -->
      <div class="form-row form-row--brutto-netto" id="brutto-netto-fields" style="display: none;">
        <div class="form-group">
          <label for="brutto-preis">Brutto-Preis (€)</label>
          <input type="number" id="brutto-preis" name="brutto-preis" placeholder="z. B. 18900" min="0">
        </div>

        <div class="form-group">
          <label for="netto-preis">Netto-Preis (€)</label>
          <input type="number" id="netto-preis" name="netto-preis" placeholder="Wird automatisch berechnet" readonly>
        </div>
      </div>

      <!-- Erstzulassung -->
      <div class="form-row">
        <div class="form-group">
          <label for="ez-monat">Erstzulassung – Monat</label>
          <select id="ez-monat" name="verkauf_ez_monat" required>
            <option value="">Monat wählen</option>
            <option value="01">Januar</option>
            <option value="02">Februar</option>
            <option value="03">März</option>
            <option value="04">April</option>
            <option value="05">Mai</option>
            <option value="06">Juni</option>
            <option value="07">Juli</option>
            <option value="08">August</option>
            <option value="09">September</option>
            <option value="10">Oktober</option>
            <option value="11">November</option>
            <option value="12">Dezember</option>
          </select>
        </div>

        <div class="form-group">
          <label for="ez-jahr">Erstzulassung – Jahr</label>
          <select id="ez-jahr" name="verkauf_ez_jahr" required>
            <option value="">Jahr wählen</option>
          </select>
        </div>

        <div class="form-group">
          <label for="kilometer">Laufleistung (km)</label>
          <input type="number" id="kilometer" name="verkauf_kilometer" min="0" required>
        </div>
      </div>

      <!-- Motor: Leistung (PS + kW) & Hubraum -->
      <div class="form-row form-row--three">
        <div class="form-group">
          <label for="leistung_ps">Leistung (PS)</label>
          <input type="number" id="leistung_ps" name="verkauf_leistung" placeholder="z. B. 190" min="1" required>
        </div>

        <div class="form-group">
          <label for="leistung_kw">Leistung (kW)</label>
          <input type="number" id="leistung_kw" name="verkauf_leistung_kw" placeholder="z. B. 140" min="1">
        </div>

        <!-- ICE only -->
        <div class="form-group mobile-full ice-only">
          <label for="hubraum">Hubraum (cm³)</label>
          <input type="number" id="hubraum" name="hubraum" placeholder="z. B. 1968">
        </div>
      </div>




<!-- EV/PHEV: Batterie, Reichweite, Verbrauch, Standard (NEU, korrekt benannt) -->

  <div class="form-row">
    <div class="form-group">
      <label for="battery_kwh">Batteriekapazität (kWh)</label>
      <input type="number" step="0.1" id="battery_kwh" name="battery_kwh" placeholder="z. B. 57.6">
    </div>
    
    <div class="form-group">
      <label for="range_km">Reichweite (km)</label>
      <input type="number" id="range_km" name="range_km" placeholder="z. B. 520">
    </div>
  </div>
  
  <div class="form-row">
    <div class="form-group">
      <label for="consumption_kwh_100">Stromverbrauch (kWh/100 km)</label>
      <input type="number" step="0.1" id="consumption_kwh_100" name="consumption_kwh_100" placeholder="z. B. 11.8">
    </div>
    
    <div class="form-group">
      <label for="ev_range_standard">Messstandard</label>
      <select id="ev_range_standard" name="ev_range_standard">
        <option value="" selected>Keine Angabe</option>
        <option value="WLTP">WLTP</option>
        <option value="CLTC">CLTC</option>
        <option value="EPA">EPA</option>
      </select>
    </div>
  </div>
  
  
  
<!-- Antrieb & Getriebe -->
<div class="form-row">
  <div class="form-group">
    <label for="antriebsart">Antriebsart</label>
    <select id="antriebsart" name="antriebsart">
      <option value="" disabled selected>Bitte wählen</option>
      <option value="Frontantrieb">Frontantrieb</option>
      <option value="Heckantrieb">Heckantrieb</option>
      <option value="Allradantrieb">Allradantrieb</option>
    </select>
  </div>

  <div class="form-group">
    <label for="getriebe">Getriebe</label>
    <select id="getriebe" name="verkauf_getriebe" required>
      <option value="" disabled selected>Bitte wählen</option>
      <option value="Schaltgetriebe">Schaltgetriebe</option>
      <option value="Automatik">Automatik</option>
    </select>
  </div>
</div>

<!-- Fahrzeugtyp & Türen -->
<div class="form-row">
  <div class="form-group">
    <label for="fahrzeugtyp">Fahrzeugtyp</label>
    <select id="fahrzeugtyp" name="fahrzeugtyp" required>
      <option value="" disabled selected>Bitte wählen</option>
      <option value="Limousine">Limousine</option>
      <option value="Van / Minibus">Van / Minibus</option>
      <option value="Kombi">Kombi</option>
      <option value="Geländewagen / SUV">Geländewagen / SUV</option>
      <option value="Cabrio / Roadster">Cabrio / Roadster</option>
      <option value="Kleinwagen">Kleinwagen</option>
      <option value="Sportwagen / Coupé">Sportwagen / Coupé</option>
    </select>
  </div>
  

  <div class="form-group">
    <label for="türen">Türen</label>
    <select id="türen" name="türen">
      <option value="" disabled selected>Bitte wählen</option>
      <option value="2/3">2 / 3 Türen</option>
      <option value="4/5">4 / 5 Türen</option>
    </select>
  </div>
  </div>

<!-- Sitze + Elektro-spezifische Werte -->
<div class="form-row">
  <div class="form-group">
    <label for="places">Sitze</label>
    <select id="places" name="places">
      <option value="" disabled selected>Bitte wählen</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
      <option value="6">6</option>
      <option value="7">7</option>
      <option value="8">8</option>
      <option value="9">9</option>
    </select>
  </div>


<!-- Kraftstoff & Partikelfilter -->

  <div class="form-group">
    <label for="kraftstoff">Kraftstoffart</label>
    <select id="kraftstoff" name="verkauf_kraftstoff" required>
      <option value="" disabled selected>Bitte wählen</option>
      <option value="Benzin">Benzin</option>
      <option value="Diesel">Diesel</option>
      <option value="Elektro">Elektro</option>
      <option value="Hybrid (Benzin)">Hybrid (Benzin)</option>
      <option value="Hybrid (Diesel)">Hybrid (Diesel)</option>
      <option value="Autogas (LPG)">Autogas (LPG)</option>
      <option value="Wasserstoff">Wasserstoff</option>
      <option value="Ethanol">Ethanol</option>
    </select>
  </div>
  </div>

  


  <!-- Verbrauch & Emission (klassisch) -->
<div class="form-row ice-only">
  <div class="form-group">
    <label for="verbrauch_kombiniert">Verbrauch (kombiniert)</label>
    <input
      type="number"
      step="0.1"
      min="0"
      id="verbrauch_kombiniert"
      name="verbrauch_kombiniert"
      placeholder="z. B. 5,0">
  </div>
  
  
    <div class="form-group">
    <label for="verbrauch_innerorts">Verbrauch (innerorts)</label>
    <input
      type="number"
      step="0.1"
      min="0"
      id="verbrauch_innerorts"
      name="verbrauch_innerorts"
      placeholder="z. B. 5,4">
  </div>
  </div>
  
  
  

<div class="form-row ice-only">
  <div class="form-group">
    <label for="verbrauch_ausserorts">Verbrauch (außerorts)</label>
    <input
      type="number"
      step="0.1"
      min="0"
      id="verbrauch_ausserorts"
      name="verbrauch_ausserorts"
      placeholder="z. B. 4,8">
  </div>
 
  
  
  
  
  <div class="form-group">
    <label for="co2_emission">CO₂-Emissionen (g/km)</label>
    <input
      type="number"
      step="1"
      min="0"
      id="co2_emission"
      name="co2_emission"
      placeholder="z. B. 132">
  </div>
  </div>

<div class="form-row ice-only">
  <div class="form-group ice-only">
    <label for="partikelfilter">Partikelfilter</label>
    <select id="partikelfilter" name="partikelfilter">
      <option value="" disabled selected>Bitte wählen</option>
      <option value="Ja">Ja</option>
      <option value="Nein">Nein</option>
    </select>
  </div>
  
  
  
  <!-- Schadstoffklasse, Umweltplakette & Energieeffizienzklasse -->
  
  <div class="form-group">
    <label for="schadstoffklasse">Schadstoffklasse</label>
    <select id="schadstoffklasse" name="schadstoffklasse">
      <option value="" disabled selected>Bitte wählen</option>
      <option value="Keine Angabe">Keine Angabe</option>
      <option value="Euro 1">Euro 1</option>
      <option value="Euro 2">Euro 2</option>
      <option value="Euro 3">Euro 3</option>
      <option value="Euro 4">Euro 4</option>
      <option value="Euro 5">Euro 5</option>
      <option value="Euro 6">Euro 6</option>
      <option value="Euro 6c">Euro 6c</option>
      <option value="Euro 6d-TEMP">Euro 6d-TEMP</option>
      <option value="Euro 6d">Euro 6d</option>
    </select>
  </div>
</div>
  
  <div class="form-row ice-only">
  <div class="form-group">
    <label for="umweltplakette">Umweltplakette</label>
    <select id="umweltplakette" name="umweltplakette">
      <option value="" disabled selected>Bitte wählen</option>
      <option value="Keine">Keine</option>
      <option value="Rot">Rot (Stufe 2)</option>
      <option value="Gelb">Gelb (Stufe 3)</option>
      <option value="Grün">Grün (Stufe 4)</option>
    </select>
  </div>
  
  <!-- wie bei Hubraum: auf Mobile ggf. volle Breite -->
  <div class="form-group mobile-full">
    <label for="emissionsklasse">Energieeffizienzklasse</label>
    <select id="emissionsklasse" name="emissionsklasse">
      <option value="" disabled selected>Bitte wählen</option>
      <option value="A+">A+</option>
      <option value="A">A</option>
      <option value="B">B</option>
      <option value="C">C</option>
      <option value="D">D</option>
      <option value="E">E</option>
      <option value="F">F</option>
      <option value="G">G</option>
      <option value="Keine Angabe">Keine Angabe</option>
    </select>
  </div>
</div>



<!-- Speichern + Zurück (INNERHALB des Formulars) -->
<div class="form-row" style="justify-content: space-between; margin-top: 30px;">
  <a id="backButton" class="back-button">
    <i class="fas fa-arrow-left"></i> Zurück
  </a>

  <button type="submit" class="save-button">
    <i class="fas fa-save"></i> Speichern
  </button>
</div>

</form>
</div>
</main>

<script src="fahrzeugdaten.js"></script>
  <script src="ui-feedback.js" defer></script>
</body>
</html>
